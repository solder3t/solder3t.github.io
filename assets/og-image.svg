      <text x="68" y="23" fill="#182530" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Thoughtful software</text>
      <text x="68" y="47" fill="#69757d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">by an independent developer</text>
