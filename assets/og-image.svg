<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8f7f2"/>
      <stop offset="1" stop-color="#eae8df"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#455bd4"/>
      <stop offset="1" stop-color="#16756f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#455bd4"/>
      <stop offset="1" stop-color="#16756f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#182530" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#canvas)"/>
  <circle cx="1050" cy="50" r="270" fill="#dfe4f7" opacity=".55"/>
  <circle cx="1130" cy="585" r="220" fill="#d4e8e1" opacity=".58"/>
  <g transform="translate(80 68)">
