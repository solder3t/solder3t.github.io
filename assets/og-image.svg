    <path d="M40 18H28L18 28h20L28 38H16" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="40" cy="18" r="3" fill="#fff"/><circle cx="28" cy="28" r="2.5" fill="#fff"/><circle cx="16" cy="38" r="3" fill="#fff"/>
    <text x="72" y="39" fill="#182530" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="-.8">Solder3t</text>
  </g>
  <text x="80" y="260" fill="#182530" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="750" letter-spacing="-2.5">Software that feels</text>
  <text x="80" y="336" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="750" letter-spacing="-2.8">right at home.</text>
  <text x="84" y="397" fill="#52616b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">Independent apps and tools for Android and Linux.</text>
  <g transform="translate(84 452)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650">
    <rect width="126" height="42" rx="21" fill="#fffefa" stroke="#d9ddd9"/><text x="63" y="27" text-anchor="middle" fill="#315c8a">ANDROID</text>
    <rect x="140" width="104" height="42" rx="21" fill="#fffefa" stroke="#d9ddd9"/><text x="192" y="27" text-anchor="middle" fill="#116b67">LINUX</text>
    <rect x="258" width="152" height="42" rx="21" fill="#fffefa" stroke="#d9ddd9"/><text x="334" y="27" text-anchor="middle" fill="#455bd4">OPEN SOURCE</text>
  </g>
  <g filter="url(#shadow)" transform="translate(790 102)">
    <rect width="330" height="426" rx="28" fill="#fffefa" stroke="#d9ddd9"/>
    <rect x="24" y="24" width="282" height="34" rx="10" fill="#f1f2f7"/>
    <circle cx="44" cy="41" r="4" fill="#d18178"/><circle cx="60" cy="41" r="4" fill="#d7ad57"/><circle cx="76" cy="41" r="4" fill="#72aa85"/>
    <text x="28" y="112" fill="#66727b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">$ solder3t --build</text>
    <text x="28" y="163" fill="#182530" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Made with care.</text>
    <text x="28" y="197" fill="#52616b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Built for everyday use.</text>
    <rect x="28" y="237" width="274" height="1" fill="#e5e6e1"/>
